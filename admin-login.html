<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Zona VIP</title>
<link rel="stylesheet" href="admin-login.css">
</head>
<body>

<div class="login-box">
   <img src="images/Logo3Expand.png" class="logo">

   <h2>Acceso VIP</h2>
   <p class="sub">Zona privada administrativa</p>

   <input type="text" id="user" placeholder="Usuario">
   <input type="password" id="pass" placeholder="Contraseña">

  <button onclick="login()">Entrar</button>

<p class="recuperar" onclick="recuperar()">
¿Olvidaste tu contraseña?
</p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
   
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  sendPasswordResetEmail,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyB0YrXAOE7eg04N6c3ZqLsBUUz8VBfHD58",
  authDomain: "moises-celulares.firebaseapp.com",
  projectId: "moises-celulares",
  appId: "1:392580256106:web:e31ae4c958effb4eb91513"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// LOGIN
window.login = function(){
  const email = document.getElementById("user").value;
  const password = document.getElementById("pass").value;

  signInWithEmailAndPassword(auth, email, password)
    .then(() => {
      window.location.href = "admin.html";
    })
    .catch((error) => {
      alert("Correo o contraseña incorrectos");
      console.log(error);
    });
};

// RECUPERAR CONTRASEÑA
window.recuperar = function(){
  const email = document.getElementById("user").value;

  if(!email){
    alert("Escribe tu correo primero");
    return;
  }

  sendPasswordResetEmail(auth, email)
    .then(()=>{
      alert("Te enviamos un correo para recuperar tu contraseña");
    })
    .catch(()=>{
      alert("Error al enviar el correo");
    });
};
</script>

</body>
</html>
