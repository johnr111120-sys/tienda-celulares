<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<h1>Panel Administración</h1>

  <div id="estadisticas" style="display:flex; flex-wrap:wrap; gap:25px; margin-bottom:25px; font-size:14px;">
   <div><strong>Total Pedidos:</strong> <span id="totalPedidos">0</span></div>
   <div><strong>Pendientes:</strong> <span id="totalPendientes">0</span> <span id="alertaPendientes"></span></div>
   <div><strong>Total Vendido Hoy:</strong> $<span id="totalHoy">0</span></div>
   <div><strong>Total Vendido General:</strong> $<span id="totalGeneral">0</span></div>
   <div><strong>Promedio por Pedido:</strong> $<span id="promedioPedido">0</span></div>
   <div><strong>Últimos 7 días:</strong> $<span id="ventasSemana">0</span></div>
</div>

<h2>Ventas</h2>
<div class="filtros-grafica">
   <button class="activo" onclick="cambiarGrafica('semana', this)">Ventas semanales</button>
   <button onclick="cambiarGrafica('dia', this)">Ventas diarias</button>
   <button onclick="cambiarGrafica('mes', this)">Ventas mensuales</button>
   <button onclick="cambiarGrafica('anio', this)">Ventas anual</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<canvas id="graficaVentas" height="50"></canvas>
<p id="comparacionMes" style="margin-top:10px; font-weight:bold;"></p>
  
<h3 id="contadorPendientes"></h3>
<select id="filtroEstado" onchange="cargarPedidos()">
  <option value="todos">Todos</option>
  <option value="pendiente">Pendientes</option>
  <option value="enviado">Enviados</option>
  <option value="entregado">Entregados</option>
</select>
  
<h2>Pedidos</h2>
<div id="listaPedidos"></div>
  
<button onclick="nuevoProducto()">➕ Nuevo Producto</button>

<div id="listaAdmin"></div>

<script src="admin.js"></script>
<audio id="sonidoPedido" src="https://assets.mixkit.co/sfx/preview/mixkit-positive-notification-951.mp3"></audio>
  
</body>
</html>
